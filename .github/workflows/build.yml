name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

# 目标矩阵：Cindy 支持的每个平台都要有对应产物。
# 产物名统一 <tool>-<os>-<arch>[.exe]；zig 的 -Dtarget= 三元组是 zig 的对外契约，原样保留。
#   cube-cli-linux-arm64     aarch64-linux-musl
#   cube-cli-linux-amd64     x86_64-linux-musl
#   cube-cli-macos-arm64     aarch64-macos       （codesign - 临时签名）
#   cube-cli-macos-amd64     x86_64-macos        （codesign - 临时签名）
#   cube-cli-windows-amd64   x86_64-windows-gnu
#   cube-cli-windows-arm64   aarch64-windows-gnu （无可用 arm64 Windows runner，仅校验编译）

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-linux-musl,  name: cube-cli-linux-arm64,   runner: ubuntu-24.04-arm }
          - { target: x86_64-linux-musl,   name: cube-cli-linux-amd64,   runner: ubuntu-latest }
          - { target: aarch64-macos,       name: cube-cli-macos-arm64,   runner: macos-14 }
          - { target: x86_64-macos,        name: cube-cli-macos-amd64,   runner: macos-14 }
          - { target: x86_64-windows-gnu,  name: cube-cli-windows-amd64, runner: ubuntu-latest }
          - { target: aarch64-windows-gnu, name: cube-cli-windows-arm64, runner: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: 构建
        shell: bash
        run: |
          set -o pipefail
          zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }} 2>&1 | tee build.log

      - name: 失败时上传构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: err-${{ matrix.name }}
          path: build.log

      - name: 收集产物
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          case "${{ matrix.target }}" in *windows*) ext=".exe" ;; esac
          cp "zig-out/bin/cube-cli${ext}" "${{ matrix.name }}${ext}"
          ls -l "${{ matrix.name }}${ext}"

      - name: macOS 临时签名
        if: contains(matrix.target, 'macos')
        run: |
          f="${{ matrix.name }}"
          codesign --force --sign - --timestamp=none "$f"
          codesign --verify "$f"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}
            ${{ matrix.name }}.exe

  # 产物必须在对应平台真跑一遍 version，编译通过不等于能运行
  smoke:
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { artifact: cube-cli-linux-arm64,   runner: ubuntu-24.04-arm }
          - { artifact: cube-cli-linux-amd64,   runner: ubuntu-latest }
          - { artifact: cube-cli-macos-arm64,   runner: macos-14 }
          - { artifact: cube-cli-macos-amd64,   runner: macos-14 }
          - { artifact: cube-cli-windows-amd64, runner: windows-latest }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: bin

      - name: 冒烟测试
        shell: bash
        run: |
          set -euo pipefail
          ls -la bin/
          if [ "$RUNNER_OS" = "Windows" ]; then
            if [ -f "bin/${{ matrix.artifact }}.exe" ]; then
              exe="bin/${{ matrix.artifact }}.exe"
            else
              mv "bin/${{ matrix.artifact }}" "bin/${{ matrix.artifact }}.exe"
              exe="bin/${{ matrix.artifact }}.exe"
            fi
            "$exe" version
          else
            chmod +x "bin/${{ matrix.artifact }}"
            "bin/${{ matrix.artifact }}" version
          fi

  # 跨平台功能测试：编译通过不等于能跑。三个 OS 各自原生构建，跑同一个 Python
  # 测试套件（mock 控制面 + MCP 协议）。macOS / Windows 的产物只有在这里才真正
  # 被执行过。
  func:
    runs-on: ${{ matrix.runner }}
    # Windows runner 的 Python stdout 默认是 cp1252，打中文测试名会 UnicodeEncodeError。
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   runner: ubuntu-latest }
          - { os: macos,   runner: macos-14 }
          - { os: windows, runner: windows-latest }
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 原生构建
        shell: bash
        run: zig build -Doptimize=ReleaseFast

      - name: CLI 冒烟（version / help / 未知命令退出码）
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          case "${{ matrix.os }}" in windows) ext=".exe" ;; esac
          bin="zig-out/bin/cube-cli$ext"
          ls -l "$bin"
          "$bin" version
          "$bin" help > /dev/null
          "$bin" help all > /dev/null
          if "$bin" definitely-not-a-command > /dev/null 2>&1; then
            echo "未知命令返回 0（应为非 0）"
            exit 1
          fi

      - name: 功能测试套件（全部跑完再判，不早停）
        shell: bash
        run: |
          set -o pipefail
          ext=""
          case "${{ matrix.os }}" in windows) ext=".exe" ;; esac
          bin="zig-out/bin/cube-cli$ext"
          mkdir -p ci-logs
          rc=0
          run_suite() {
            name="$1"; shift
            echo "===== $name ====="
            if "$@" 2>&1 | tee "ci-logs/$name.txt"; then echo "[PASS] $name"; else echo "[FAIL] $name"; rc=1; fi
          }
          run_suite protocol tests/mcp_protocol_test.py --bin "$bin" --tools-min 37
          run_suite tools tests/mcp_cube_tools_test.py --bin "$bin"
          run_suite bigoutput tests/mcp_big_output_test.py --bin "$bin"
          run_suite edge tests/mcp_cube_edge_test.py --bin "$bin"
          exit $rc

      - name: 上传测试日志（失败也要）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: func-logs-${{ matrix.os }}
          path: ci-logs/*.txt
          if-no-files-found: warn

  release:
    needs: [build, smoke, func]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成校验和
        run: |
          cd dist
          ls -la
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          files: dist/*
          make_latest: true
